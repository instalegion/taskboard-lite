<!DOCTYPE html>
<html lang="el">
<head>
  <meta charset="UTF-8">
  <title>TaskBoard Lite</title>
  <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-slate-100 min-h-screen text-slate-800">

  <!-- AUTH SCREEN -->
  <div id="auth-section" class="flex items-center justify-center min-h-screen">
    <div class="bg-white p-8 rounded-xl shadow-md w-96 border border-slate-200">
      <h1 class="text-2xl font-bold text-center mb-6 text-indigo-600">TaskBoard Lite</h1>
      
      <div class="space-y-4">
        <div>
          <label class="block text-sm font-medium mb-1">Email</label>
          <input id="auth-email" type="email" class="w-full border rounded-lg p-2.5 outline-none focus:ring-2 focus:ring-indigo-500" placeholder="user@example.com">
        </div>
        <div>
          <label class="block text-sm font-medium mb-1">Password</label>
          <input id="auth-password" type="password" class="w-full border rounded-lg p-2.5 outline-none focus:ring-2 focus:ring-indigo-500" placeholder="••••••••">
        </div>
        <button onclick="handleLogin()" class="w-full bg-indigo-600 hover:bg-indigo-700 text-white font-medium py-2.5 rounded-lg transition">Σύνδεση</button>
        <button onclick="handleRegister()" class="w-full bg-slate-100 hover:bg-slate-200 text-slate-700 font-medium py-2.5 rounded-lg transition">Εγγραφή</button>
      </div>
      <p id="auth-error" class="text-red-500 text-sm mt-3 text-center hidden"></p>
    </div>
  </div>

  <!-- MAIN APP SCREEN -->
  <div id="app-section" class="hidden">
    <!-- Navbar -->
    <header class="bg-white border-b border-slate-200 px-6 py-4 flex justify-between items-center">
      <div class="flex items-center space-x-4">
        <h1 class="text-xl font-bold text-indigo-600">TaskBoard Lite</h1>
        <select id="board-select" onchange="loadTasks()" class="border rounded-lg p-1.5 text-sm bg-slate-50 outline-none">
        </select>
        <button onclick="createBoardPrompt()" class="text-sm bg-indigo-50 text-indigo-600 px-3 py-1.5 rounded-lg hover:bg-indigo-100 font-medium">+ Νέο Board</button><button onclick="renameCurrentBoard()" class="text-sm bg-gray-100 text-gray-700 px-3 py-1.5 rounded-lg hover:bg-gray-200 font-medium">Επεξεργασία Board</button><button onclick="deleteCurrentBoard()" class="text-sm bg-red-50 text-red-600 px-3 py-1.5 rounded-lg hover:bg-red-100 font-medium">Διαγραφή Board</button>
      </div>
      <div class="flex items-center space-x-4">
        <span id="user-display" class="text-sm text-slate-500"></span>
        <button onclick="logout()" class="text-sm bg-red-50 text-red-600 px-3 py-1.5 rounded-lg hover:bg-red-100">Αποσύνδεση</button>
      </div>
    </header>

    <!-- Stats Bar (In-Memory Cache) -->
    <div class="max-w-7xl mx-auto px-6 pt-6">
      <div class="bg-white p-4 rounded-xl border border-slate-200 shadow-sm flex items-center justify-between text-sm">
        <div class="flex space-x-6">
          <span>Σύνολο: <strong id="stat-total">0</strong></span>
          <span>To Do: <strong id="stat-todo" class="text-amber-600">0</strong></span>
          <span>In Progress: <strong id="stat-progress" class="text-blue-600">0</strong></span>
          <span>Done: <strong id="stat-done" class="text-emerald-600">0</strong></span>
        </div>
        <div id="stat-source" class="text-xs bg-slate-100 px-2.5 py-1 rounded text-slate-500">Πηγή: -</div>
      </div>
    </div>

    <!-- Actions -->
    <div class="max-w-7xl mx-auto px-6 py-4 flex justify-between items-center">
      <h2 class="text-lg font-semibold" id="current-board-title">Board</h2>
      <button onclick="createTaskPrompt()" class="bg-indigo-600 hover:bg-indigo-700 text-white text-sm px-4 py-2 rounded-lg shadow transition">+ Νέο Task</button>
    </div>

    <!-- Kanban Columns -->
    <main class="max-w-7xl mx-auto px-6 pb-12 grid grid-cols-1 md:grid-cols-3 gap-6">
      <!-- TO DO -->
      <div class="bg-slate-200/60 p-4 rounded-xl">
        <h3 class="font-semibold text-slate-700 mb-3 flex items-center justify-between">
          <span>To Do</span>
          <span id="count-todo" class="text-xs bg-slate-300 px-2 py-0.5 rounded-full">0</span>
        </h3>
        <div id="tasks-todo" class="space-y-3 min-h-[150px]"></div>
      </div>

      <!-- IN PROGRESS -->
      <div class="bg-slate-200/60 p-4 rounded-xl">
        <h3 class="font-semibold text-slate-700 mb-3 flex items-center justify-between">
          <span>In Progress</span>
          <span id="count-progress" class="text-xs bg-slate-300 px-2 py-0.5 rounded-full">0</span>
        </h3>
        <div id="tasks-progress" class="space-y-3 min-h-[150px]"></div>
      </div>

      <!-- DONE -->
      <div class="bg-slate-200/60 p-4 rounded-xl">
        <h3 class="font-semibold text-slate-700 mb-3 flex items-center justify-between">
          <span>Done</span>
          <span id="count-done" class="text-xs bg-slate-300 px-2 py-0.5 rounded-full">0</span>
        </h3>
        <div id="tasks-done" class="space-y-3 min-h-[150px]"></div>
      </div>
    </main>
  </div>

  <script>
    const API_URL = "http://127.0.0.1:8000";
    let token = localStorage.getItem("token") || null;
    let currentBoardId = null;

    if (token) {
      showApp();
    }

    async function handleRegister() {
      const email = document.getElementById("auth-email").value;
      const password = document.getElementById("auth-password").value;
      const res = await fetch(`${API_URL}/auth/register`, {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ email, password })
      });
      if (res.ok) {
        alert("Επιτυχής εγγραφή! Συνδεθείτε.");
      } else {
        const data = await res.json();
        showError(data.detail || "Σφάλμα εγγραφής");
      }
    }

    async function handleLogin() {
      const email = document.getElementById("auth-email").value;
      const password = document.getElementById("auth-password").value;
      const formData = new URLSearchParams();
      formData.append("username", email);
      formData.append("password", password);

      const res = await fetch(`${API_URL}/auth/login`, {
        method: "POST",
        headers: { "Content-Type": "application/x-www-form-urlencoded" },
        body: formData
      });

      if (res.ok) {
        const data = await res.json();
        token = data.access_token;
        localStorage.setItem("token", token);
        showApp();
      } else {
        showError("Λάθος email ή κωδικός");
      }
    }

    function logout() {
      token = null;
      localStorage.removeItem("token");
      document.getElementById("auth-section").classList.remove("hidden");
      document.getElementById("app-section").classList.add("hidden");
    }

    function showError(msg) {
      const err = document.getElementById("auth-error");
      err.innerText = msg;
      err.classList.remove("hidden");
    }

    async function showApp() {
      document.getElementById("auth-section").classList.add("hidden");
      document.getElementById("app-section").classList.remove("hidden");
      await loadBoards();
    }

    async function loadBoards() {
      const res = await fetch(`${API_URL}/boards`, {
        headers: { "Authorization": `Bearer ${token}` }
      });
      if (res.status === 401) return logout();
      const boards = await res.json();
      const select = document.getElementById("board-select");
      select.innerHTML = "";

      if (boards.length === 0) {
        await createDefaultBoard();
        return;
      }

      boards.forEach(b => {
        const opt = document.createElement("option");
        opt.value = b.id;
        opt.innerText = b.title;
        select.appendChild(opt);
      });

      currentBoardId = boards[0].id;
      loadTasks();
    }

    async function createDefaultBoard() {
      await fetch(`${API_URL}/boards`, {
        method: "POST",
        headers: {
          "Content-Type": "application/json",
          "Authorization": `Bearer ${token}`
        },
        body: JSON.stringify({ title: "My Sprint Board" })
      });
      loadBoards();
    }

    async function createBoardPrompt() {
      const title = prompt("Όνομα νέου Board:");
      if (!title) return;
      await fetch(`${API_URL}/boards`, {
        method: "POST",
        headers: {
          "Content-Type": "application/json",
          "Authorization": `Bearer ${token}`
        },
        body: JSON.stringify({ title })
      });
      loadBoards();
    }

    async function createTaskPrompt() {
      const title = prompt("Τίτλος Task:");
      if (!title) return;
      const description = prompt("Περιγραφή (προαιρετικό):") || "";
      await fetch(`${API_URL}/boards/${currentBoardId}/tasks`, {
        method: "POST",
        headers: {
          "Content-Type": "application/json",
          "Authorization": `Bearer ${token}`
        },
        body: JSON.stringify({ title, description, status: "To Do" })
      });
      loadTasks();
    }

    async function updateStatus(taskId, newStatus) {
      await fetch(`${API_URL}/tasks/${taskId}`, {
        method: "PUT",
        headers: {
          "Content-Type": "application/json",
          "Authorization": `Bearer ${token}`
        },
        body: JSON.stringify({ status: newStatus })
      });
      loadTasks();
    }

    async function deleteTask(taskId) {
      if (!confirm("Διαγραφή αυτού του task;")) return;
      await fetch(`${API_URL}/tasks/${taskId}`, {
        method: "DELETE",
        headers: { "Authorization": `Bearer ${token}` }
      });
      loadTasks();
    }

async function editTaskPrompt(taskId, currentTitle, currentDesc) {
      const newTitle = prompt("Επεξεργασία τίτλου task:", currentTitle);
      if (newTitle === null) return; // Πάτησε άκυρο
      const finalTitle = newTitle.trim() || currentTitle;

      const newDesc = prompt("Επεξεργασία περιγραφής task:", currentDesc);
      if (newDesc === null) return; // Πάτησε άκυρο
      const finalDesc = newDesc.trim();

      const res = await fetch(`${API_URL}/tasks/${taskId}`, {
        method: "PUT",
        headers: {
          "Content-Type": "application/json",
          "Authorization": `Bearer ${token}`
        },
        body: JSON.stringify({
          title: finalTitle,
          description: finalDesc
        })
      });

      if (res.ok) {
        loadTasks();
      } else {
        alert("Σφάλμα κατά την ενημέρωση του task.");
      }
    }

    async function deleteCurrentBoard() {
  if (!currentBoardId) return;
  if (!confirm("Είσαι σίγουρος ότι θέλεις να διαγράψεις αυτό το Board και όλα τα tasks του;")) return;

  const res = await fetch(`${API_URL}/boards/${currentBoardId}`, {
    method: "DELETE",
    headers: { "Authorization": `Bearer ${token}` }
  });

  if (res.ok) {
    alert("Το Board διαγράφηκε!");
    loadBoards(); // Επαναφόρτωση της λίστας των boards
  } else {
    alert("Σφάλμα κατά τη διαγραφή του board.");
  }
}

    async function loadTasks() {
      currentBoardId = document.getElementById("board-select").value;
      if (!currentBoardId) return;

      const res = await fetch(`${API_URL}/boards/${currentBoardId}/tasks`, {
        headers: { "Authorization": `Bearer ${token}` }
      });
      const tasks = await res.json();

      const todoCol = document.getElementById("tasks-todo");
      const progCol = document.getElementById("tasks-progress");
      const doneCol = document.getElementById("tasks-done");

      todoCol.innerHTML = "";
      progCol.innerHTML = "";
      doneCol.innerHTML = "";

      tasks.forEach(t => {
        const card = document.createElement("div");
        card.className = "bg-white p-3 rounded-lg border border-gray-200 shadow-sm relative";
        
        card.innerHTML = `
          <div class="flex items-start justify-between">
            <h4 
              contenteditable="true" 
              spellcheck="false"
              class="font-medium text-gray-800 text-sm outline-none focus:bg-blue-50 focus:ring-1 focus:ring-blue-400 rounded px-1 -mx-1 flex-1"
              title="Κλικ για επεξεργασία τίτλου"
              onkeydown="if(event.key==='Enter'){event.preventDefault(); this.blur();}"
              onblur="updateTaskInline(${t.id}, 'title', this.innerText)"
            >${t.title}</h4>
            <button onclick="deleteTask(${t.id})" class="text-gray-400 hover:text-red-500 font-bold ml-2 text-base leading-none" title="Διαγραφή">×</button>
          </div>
          
          <p 
            contenteditable="true" 
            spellcheck="false"
            class="text-xs text-gray-500 mt-1 outline-none focus:bg-blue-50 focus:ring-1 focus:ring-blue-400 rounded px-1 -mx-1 min-h-[16px]"
            title="Κλικ για επεξεργασία περιγραφής"
            onblur="updateTaskInline(${t.id}, 'description', this.innerText)"
          >${t.description || ''}</p>

          <div class="mt-3 flex justify-end gap-1">
            ${t.status !== 'To Do' ? `<button onclick="moveTaskStatus(${t.id}, 'To Do')" class="text-[11px] bg-gray-100 hover:bg-gray-200 text-gray-700 px-2 py-1 rounded font-medium">← To Do</button>` : ''}
            ${t.status !== 'In Progress' ? `<button onclick="moveTaskStatus(${t.id}, 'In Progress')" class="text-[11px] bg-blue-50 hover:bg-blue-100 text-blue-700 px-2 py-1 rounded font-medium">${t.status === 'Done' ? '← In Prog' : 'In Prog →'}</button>` : ''}
            ${t.status !== 'Done' ? `<button onclick="moveTaskStatus(${t.id}, 'Done')" class="text-[11px] bg-emerald-50 hover:bg-emerald-100 text-emerald-700 px-2 py-1 rounded font-medium">Done →</button>` : ''}
          </div>
        `;

        if (t.status === "To Do") todoCol.appendChild(card);
        else if (t.status === "In Progress") progCol.appendChild(card);
        else if (t.status === "Done") doneCol.appendChild(card);
      });

      // Ανανέωση των στατιστικών και του badge πηγής (Cache vs DB)
      if (typeof loadStats === "function") {
        await loadStats();
      }
    }

    // Συνάρτηση για αλλαγή κατάστασης (μετακίνηση στήλης)
    async function moveTaskStatus(taskId, newStatus) {
      await fetch(`${API_URL}/tasks/${taskId}`, {
        method: "PUT",
        headers: {
          "Content-Type": "application/json",
          "Authorization": `Bearer ${token}`
        },
        body: JSON.stringify({ status: newStatus })
      });
      loadTasks();
    }

    // Συνάρτηση inline επεξεργασίας τίτλου/περιγραφής
    async function updateTaskInline(taskId, field, value) {
      const payload = {};
      payload[field] = value.trim();

      await fetch(`${API_URL}/tasks/${taskId}`, {
        method: "PUT",
        headers: {
          "Content-Type": "application/json",
          "Authorization": `Bearer ${token}`
        },
        body: JSON.stringify(payload)
      });
      // Ανανεώνουμε και τα στατιστικά αν χρειάζεται
      if (typeof loadStats === "function") {
        loadStats();
      }
    }

    async function updateTaskField(taskId, field, value) {
      const payload = {};
      payload[field] = value.trim();

      await fetch(`${API_URL}/tasks/${taskId}`, {
        method: "PUT",
        headers: {
          "Content-Type": "application/json",
          "Authorization": `Bearer ${token}`
        },
        body: JSON.stringify(payload)
      });
    }

    async function loadStats() {
      const res = await fetch(`${API_URL}/boards/${currentBoardId}/stats`, {
        headers: { "Authorization": `Bearer ${token}` }
      });
      const data = await res.json();
      document.getElementById("stat-total").innerText = data.stats.total;
      document.getElementById("stat-todo").innerText = data.stats.todo;
      document.getElementById("stat-progress").innerText = data.stats.in_progress;
      document.getElementById("stat-done").innerText = data.stats.done;
      
      const badge = document.getElementById("stat-source");
      if (data.source === "cache") {
        badge.innerText = "⚡ Πηγή: In-Memory Cache";
        badge.className = "text-xs bg-emerald-100 text-emerald-700 px-2.5 py-1 rounded font-medium";
      } else {
        badge.innerText = "💾 Πηγή: Database";
        badge.className = "text-xs bg-blue-100 text-blue-700 px-2.5 py-1 rounded font-medium";
      }
    }

// Μετονομασία Board
async function renameCurrentBoard() {
  if (!currentBoardId) {
    alert("Επίλεξε πρώτα ένα board!");
    return;
  }

  // Ασφαλής ανάκτηση του τίτλου είτε από select είτε με κενό fallback
  const selectEl = document.querySelector("select");
  const currentTitle = (selectEl && selectEl.selectedOptions && selectEl.selectedOptions[0]) 
    ? selectEl.selectedOptions[0].text 
    : "";

  const newTitle = prompt("Νέος τίτλος για το Board:", currentTitle);
  if (newTitle === null) return; // Πάτησε cancel
  const trimmedTitle = newTitle.trim();
  if (!trimmedTitle || trimmedTitle === currentTitle) return;

  const res = await fetch(`${API_URL}/boards/${currentBoardId}`, {
    method: "PUT",
    headers: {
      "Content-Type": "application/json",
      "Authorization": `Bearer ${token}`
    },
    body: JSON.stringify({ title: trimmedTitle })
  });

  if (res.ok) {
    await loadBoards();
  } else {
    alert("Σφάλμα κατά την ενημέρωση του board.");
  }
}

// Επεξεργασία Task (Τίτλος & Περιγραφή)
async function editTaskPrompt(taskId, oldTitle, oldDesc) {
  const newTitle = prompt("Τίτλος Task:", oldTitle);
  if (newTitle === null) return;
  
  const newDesc = prompt("Περιγραφή Task:", oldDesc);
  if (newDesc === null) return;

  const res = await fetch(`${API_URL}/tasks/${taskId}`, {
    method: "PUT",
    headers: {
      "Content-Type": "application/json",
      "Authorization": `Bearer ${token}`
    },
    body: JSON.stringify({
      title: newTitle.trim() || oldTitle,
      description: newDesc.trim()
    })
  });

  if (res.ok) {
    loadTasks();
    loadStats();
  } else {
    alert("Σφάλμα κατά την ενημέρωση του task.");
  }
}

  </script>
</body>
</html>
